---
# Structured claims for the UMAWS completion report (v1.1)
# One claim per row. For every table and Appendix D, count each claim once.
# Evidence_strength: raw_artefact | agent_authorship | code_read
#
# Verdict vocabulary (single source of truth):
#   VERIFIED-NOW  | the claim holds against the artefact (RAN-NOW or raw evidence)
#   VERIFIED-EARLIER | the claim held against earlier evidence; re-run would need the same artefact
#   UNVERIFIED    | no artefact exists, or only prose/decision-log evidence
#   FAILED        | the claim was tested and did not hold
#   NOT-BUILT     | the mechanism the claim describes does not exist
#   DIVERGES      | the claim conflicts with measured behaviour on a named point
#   WRONG-DOC     | the claim misstates a file, number, table or command in the manual
#
# Per-claim evidence_strength downgrade rule:
#   - raw_artefact: a file the operator supplied or I generated and can open
#   - agent_authorship: a summary written by an LLM/author, not a primary artefact
#   - code_read: the evidence is a code review / inspection of source
# Any claim whose only evidence is prose in decisions.md / the log gets downgraded
# one step.

