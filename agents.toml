# agents.toml — Fleet profiles.
#
# Fleet amendment section 12.A.  Human-edited TOML (pilot v1 D-P3).
#
# Free model reference: see docs/free-models.md (Nous portal + Kenari lists).
#
# A profile is one way to run one CLI on one model.  The operator's saved
# entries in prompts.json are really profiles — the same prefix repeated
# per project (fleet amendment section 6.1).  `pmk fleet import-prompts
# prompts.json` generates profiles from that file.
#
# Placeholders: {prompt} {cwd} {session} {model}.  An empty argv_resume
# means the adapter has no resume support.
#
# The resume templates and the `models` lists below are **measured**, from
# spike S-A1 run live on 2026-10-22 (pilot/spikes/s1_live.py and
# s1_live_resume.py), which ran each CLI with the prompt "print the word
# ok and exit" in a throwaway repository and then resumed each session.
# Nothing here is guessed.

[fleet]
max_total_agents   = 10        # Reduced from 100: free models too slow at high concurrency. Sun Nov 01 20:49:25 NZDT 2026 Tiwa has increased this from 6 to 10
dispatch_tick_s    = 5       # [GUESS]
stall_minutes      = 15      # [GUESS]
fix_rounds         = 2       # [GUESS]
max_restarts_per_task = 5    # [GUESS]
min_free_ram_mb    = 2048    # [GUESS]
net_probe_urls     = []      # operator or implementer supplies reachable URLs

[overseer]
# Ordered; names are placeholders (G-F13).  The strongest available model
# goes first: plan quality is the largest unknown in the whole system.
# Priority order: fast non-Poolside models first, then fallbacks
profiles = ["pi-orca-deepseek", "kilo-auto", "opencode-fallback", "opencode-strongest", "overseer-inkling", "opencode-orca-auto"]

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# Priority: lower is tried first.  Hermes first because the operator
# reports its free models are not rate limited; Cline last because its
# models have per-model daily limits (G-F3).
#
# family is DECLARED, not verified (D-L11, D-L12).  A profile with
# family = "unknown" can never serve as an independent verifier.
#
# `models` is the list of models the recovery ladder may swap to when it
# resumes a session on a different model (the L1 step).  It is empty for
# every profile except pi's, because only pi has a second model string
# that is known to be servable — inventing one would be a guess rather
# than a measurement.

[[profile]]
id = "pi-orca-glm-5-3-flash"
adapter = "pi"
family = "z-ai"          # deepseek, z-ai, tencent, upstage, etc. — NOT "pi"
priority = 100     # 30 is current for pi profiles; adjust as needed
max_concurrent = 1             # or lower if rate-limited
via_gateway = false
roles = ["implement", "review"]
argv_new = ["pi", "--provider", "orcarouter", "--model", "z-ai/glm-5.3-flash-free", "-p", "{prompt}"]
argv_resume = ["pi", "--provider", "orcarouter", "--model", "{model}", "-p", "{prompt}", "--continue"]
models = [
"deepseek/deepseek-v4-flash-free", 
"tencent/hy3-free", 
"tencent/hy4-preview-free",
]                    # empty (no L1 swap within profile; recovery ladder uses profile selection)

[[profile]]
id = "pi-orca-hy4-preview"
adapter = "pi"
family = "tencent"
priority = 102
max_concurrent = 1
via_gateway = false
roles = ["implement", "review"]
argv_new = ["pi", "--provider", "orcarouter", "--model", "tencent/hy4-preview-free", "-p", "{prompt}"]
# Measured: `--continue` resumes, and the model CAN be swapped on resume
# (exit 0 with a different model).  This is the only profile where the
# ladder's L1 step is available.
argv_resume = ["pi", "--provider", "orcarouter", "--model", "{model}", "-p", "{prompt}", "--continue"]
models = [
"tencent/hy3-free", 
"deepseek/deepseek-v4-flash-free", 
"z-ai/glm-5.3-flash-free", 
]

