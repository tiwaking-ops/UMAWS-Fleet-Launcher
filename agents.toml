# 2026-10-31: repointed to operator's current free model list (cline-free/ prefix confirmed).
# Primary: upstage/solar-mini4:free. All six are the operator's verified free models as of 2026-10-31.
# NONE of the six has been exercised yet -- verifying them costs live provider calls,
