response_time_max_ms = 900000

# ------------------------------------------------------------- quota rules
# A request must satisfy EVERY applicable rule at EVERY scope.  Note that
# scope = "provider" on an account-level rule is the one deliberate
# difference from the v1.1 model, and it is what makes "cohere" and "nous"
# ceilings independent.

# Cohere, as published.  The trial tier is the honest assumption, so 20 req/min
# is the binding limit and 1000/month is the trial cap.
[[quota_rule]]
scope = "provider"
metric = "requests"
window = "rolling_60s"
limit = 20
target = "cohere"

[[quota_rule]]
scope = "provider"
metric = "requests"
window = "fixed_monthly"
limit = 1000
target = "cohere"

[[quota_rule]]
scope = "provider"
metric = "tokens"
window = "rolling_24h"
limit = 50000
target = "cohere"

# Nous: UNVERIFIED, self-imposed.  Generous because nothing here is measured
# and a wrong ceiling would silently break working agents.
[[quota_rule]]
scope = "provider"
metric = "requests"
window = "rolling_60s"
limit = 60
target = "nous"

[[quota_rule]]
scope = "provider"
metric = "requests"
window = "rolling_24h"
limit = 600
target = "nous"

[[quota_rule]]
scope = "provider"
metric = "tokens"
window = "rolling_24h"
limit = 200000
target = "nous"

# Per-deployment ceilings, so one noisy model cannot take the whole gateway
# down and the provider-wide limit stays a backstop rather than the brake.

# Cohere trial is 20/min total, so each deployment gets a third of that.
[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_60s"
limit = 6
target = "omniroute/kilo"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_60s"
limit = 6
target = "omniroute/pi"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_60s"
limit = 6
target = "omniroute/opencode"

# Free-tier models: measured ~120 RPM with no refusals (solar-mini4, step-3.7-flash).
# Set deployment ceilings at ~1/3 of measured (40/min) to be conservative;
# provider-wide backstop at 60/min.
[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_60s"
limit = 40
target = "hermes/upstage-solar-mini4"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_60s"
limit = 40
target = "hermes/stepfun-step-3.7-flash"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_60s"
limit = 20
target = "hermes/poolside-laguna-s-2.1"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_60s"
limit = 20
target = "hermes/stealth-space-bunny-alpha"

# Daily ceilings keep a long-running fleet from eating a whole tier.
[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_24h"
limit = 300
target = "hermes/upstage-solar-mini4"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_24h"
limit = 300
target = "hermes/poolside-laguna-s-2.1"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_24h"
limit = 300
target = "hermes/stepfun-step-3.7-flash"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_24h"
limit = 200
target = "omniroute/kilo"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_24h"
limit = 200
target = "omniroute/pi"

[[quota_rule]]
scope = "deployment"
metric = "requests"
window = "rolling_24h"
limit = 200
target = "omniroute/opencode"

# ---------------------------------------------------------------- combos
# A combo is an ordered list of deployments with a routing strategy.
# The client sends model="<combo-name>" and the gateway picks which
# deployment can actually take the call now.

[combo.free-coding]
name = "free-coding"
deployments = ["hermes/upstage-solar-mini4", "hermes/stepfun-step-3.7-flash", "hermes/poolside-laguna-s-2.1"]
strategy = "use-it-or-lose-it"

[combo.cohere]
name = "cohere"
deployments = ["omniroute/kilo", "omniroute/pi", "omniroute/opencode"]
strategy = "priority"

[combo.all-free]
name = "all-free"
deployments = ["hermes/upstage-solar-mini4", "hermes/stepfun-step-3.7-flash", "hermes/poolside-laguna-s-2.1", "hermes/meituan-longcat-2.5-preview", "hermes/reflection-beam-1.0-501b-a23b", "hermes/ornith-ornith-1.5-122b", "hermes/stepfun-step-5-preview", "hermes/inclusionai-ling-3.0-flash-sante", "hermes/stealth-space-bunny-alpha", "hermes/upstage-solar-pro4"]
strategy = "headroom"
